name: pages

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck bats libxml2-utils
      - run: test/lint.sh
      - run: test/run-tests.sh

  deploy:
    needs: lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # One deploy at a time: the Pages API rejects a second deployment while
    # one is in progress, and a push shortly after another would fail.
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # configure-pages reports the address the site is served at, custom
      # domain or <owner>.github.io/<repo>, so a fork builds for its own.
      - id: pages
        uses: actions/configure-pages@v5
      - run: pages/build-site.sh _site
        env:
          HOMICRON_BASE_URL: ${{ steps.pages.outputs.base_url }}
          HOMICRON_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
